<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Monthly reporting: 1 hour 20 minutes before, 20 minutes now</title>
  <desc id="desc">The monthly hours report used to take 1 hour 20 minutes across two programs. With Wiecon Time Tracker it takes 20 minutes: 75 percent less time, four times faster.</desc>
  <rect width="1200" height="250" rx="24" fill="#16235C"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(72 0)">
      <text x="0" y="72" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" letter-spacing="2" fill="#9aa6c8">BEFORE · TWO PROGRAMS</text>
      <text x="0" y="140" font-size="56" font-weight="700" fill="#9aa6c8">1 h 20 min</text>
      <path d="M-4 120 H282" stroke="#9aa6c8" stroke-width="4"/>
    </g>
    <g transform="translate(392 0)">
      <path d="M0 122 H58" stroke="#8fb8ff" stroke-width="4"/>
      <path d="M46 110 L60 122 L46 134" stroke="#8fb8ff" stroke-width="4" fill="none" stroke-linejoin="round"/>
    </g>
    <g transform="translate(486 0)">
      <text x="0" y="72" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" letter-spacing="2" fill="#c9d6ff">NOW · ONE PROGRAM</text>
      <text x="0" y="140" font-size="56" font-weight="700" fill="#ffffff">20 min</text>
    </g>
    <path d="M760 50 V180" stroke="#2c3a7a" stroke-width="2"/>
    <g transform="translate(808 0)">
      <text x="0" y="140" font-size="96" font-weight="700" fill="#8fb8ff">75%</text>
      <text x="0" y="178" font-size="22" fill="#ffffff">less time · 4× faster</text>
    </g>
    <text x="72" y="206" font-size="20" fill="#c9d6ff">The monthly hours report, for the colleague who files it with the government.</text>
  </g>
</svg>
